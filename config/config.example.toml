# DoujinDigDatabase 配置样例(仅站点部分)

[general]
data_dir = "data"
log_level = "info"

[public]
# 会话库(重启不掉线)
sessions_db = "data/sessions.sqlite3"
# 站点对外地址
base_url = "https://www.djmb.example"
# 确实在反向代理后面才打开
behind_proxy = true
# 限速
rate_limit_enabled = true
rate_limit_rate = 10.0
rate_limit_burst = 30.0

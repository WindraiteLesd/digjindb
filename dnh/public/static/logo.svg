<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DoujinDigDatabase">
  <title>DoujinDigDatabase (DDDB)</title>
  <defs>
    <linearGradient id="dddb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- 渐变底: 与站内 .brand-mark 一致 -->
  <rect width="32" height="32" rx="8" fill="url(#dddb)"/>
  <!-- 唱片: 外圈 + 内纹 + 中心孔, 用暗色挖空 =>
       "dig" 的意象, 且 24px 高度下仍可辨识 -->
  <circle cx="16" cy="16" r="10.4" fill="none" stroke="#0c1017" stroke-width="2.6" opacity="0.92"/>
  <circle cx="16" cy="16" r="5.6" fill="none" stroke="#0c1017" stroke-width="1.7" opacity="0.66"/>
  <circle cx="16" cy="16" r="2" fill="#0c1017"/>
</svg>
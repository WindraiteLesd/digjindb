<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DoujinDigDatabase (DDDB)">
  <title>DoujinDigDatabase</title>
  <defs>
    <linearGradient id="dddb-fav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- 唱片 + 内纹 + 中心孔: 与 logo.svg 同一视觉语言,
       实心深色底保证在浅色/深色标签栏上都清晰 -->
  <rect width="64" height="64" rx="14" fill="#0c1017"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#dddb-fav)" stroke-width="5"/>
  <circle cx="32" cy="32" r="11.5" fill="none" stroke="url(#dddb-fav)" stroke-width="2.6" opacity="0.7"/>
  <circle cx="32" cy="32" r="6" fill="url(#dddb-fav)"/>
  <path d="M46 32 L52 32" stroke="url(#dddb-fav)" stroke-width="5" stroke-linecap="round"/>
</svg>